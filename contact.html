    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="icon" href="images/favicon/Fav.Contact.png">

    <style>
        .post-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-left: 4px solid var(--primary-color);
        }

        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-avatar-small {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
        }

        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 1050;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.25);
        }

        #previewTags span {
            display: inline-block;
            margin-right: 0.25rem;
            margin-bottom: 0.25rem;
        }
    </style>
</head>

<body>

    <body>
        <!-- ナビゲーションバー -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">
                    <i class="bi bi-film"></i> AniListo
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">

                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="-list.html">作品一覧</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="ranking.html">ランキング</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="mylist.html">マイリスト</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#">コミュニティ</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-lg-none" href="login.html">ログイン</a>
                        </li>
                    </ul>
                    <a href="login.html" class="btn btn-light ms-3 d-none d-lg-block">
                        <i class="bi bi-person-circle"></i> ログイン</a>
                </div>
            </div>
        </nav>

        <!-- ページヘッダー -->
        <div class="page-heading">
            <div class="container">
                <h1 class="display-4 fw-bold mb-3">
                    <i class="bi bi-envelope"></i> お問い合わせ
                </h1>
                <p class="lead">通常3営業日以内に返信いたします。</p>
            </div>
        </div>

        <div class="container">
            <div class="ms-5 me-5 mt-4 mb-4">
                <div class="card">
                    <div class="card-body">

                        <div class="mb-4">
                            <label for="Type" class="form-label fw-bold">お問い合わせ種別<span
                                    class="text-danger">*</span></label>
                            <select class="form-select" id="Select" required>
                                <option value="" disabled selected hidden>選択</option>
                                <option value="1">サイトの利用方法</option>
                                <option value="2">ご意見・ご要望</option>
                                <option value="3">誤った情報の報告</option>
                                <option value="4">返品・返金</option>
                                <option value="5">その他</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="Name" class="form-label fw-bold">お名前<span class="text-danger">*</span></label>
                            <input type="Name" class="form-control" id="FormControl" placeholder="例: 山田 太郎">
                        </div>

                        <div class="mb-4">
                            <label for="Mailaddress" class="form-label fw-bold">メールアドレス<span
                                    class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="FormControl" placeholder="email@example.com">
                        </div>

                        <div class="mb-4">
                            <label for="PhoneNumber" class="form-label fw-bold">電話番号</label>
                            <input type="Phone" class="form-control" id="FormControl" placeholder="ハイフン無し">
                        </div>

                        <div class="mb-4">
                            <label for="MainText" class="form-label fw-bold">本文 <span
                                    class="text-danger">*</span></label>
                            <textarea class="form-control" id="postContent" rows="6" placeholder="お問い合わせ内容を入力"
                                required></textarea>
                        </div>

                        <div class="text-center">
                            <button class="btn btn-dark">送信</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <footer class="py-4">
            <div class="container">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <h5 class="fw-bold mb-3"><i class="bi bi-film"></i> AniListo</h5>
                        <p class="text-light">あなたのウェアを見つけて、共有しよう。</p>
                    </div>
                    <div class="col-md-2 mb-3">
                        <h6 class="fw-bold mb-3">サイト情報</h6>
                        <ul class="list-unstyled">
                            <li><a href="#" class="text-light text-decoration-none">About</a></li>
                            <li><a href="TermsOfUse.html" class="text-light text-decoration-none">利用規約</a></li>
                            <li><a href="#" class="text-light text-decoration-none">プライバシー</a></li>
                        </ul>
                    </div>
                    <div class="col-md-2 mb-3">
                        <h6 class="fw-bold mb-3">サポート</h6>
                        <ul class="list-unstyled">
                            <li><a href="#" class="text-light text-decoration-none">ヘルプ</a></li>
                            <li><a href="#" class="text-light text-decoration-none">お問い合わせ</a></li>
                            <li><a href="#" class="text-light text-decoration-none">FAQ</a></li>
                        </ul>
                    </div>
                    <div class="col-md-4 mb-3">
                        <h6 class="fw-bold mb-3">フォローする</h6>
                        <div class="d-flex gap-3">
                            <a href="#" class="text-light"><i class="bi bi-twitter fs-4"></i></a>
                            <a href="#" class="text-light"><i class="bi bi-instagram fs-4"></i></a>
                            <a href="#" class="text-light"><i class="bi bi-youtube fs-4"></i></a>
                            <a href="#" class="text-light"><i class="bi bi-discord fs-4"></i></a>
                        </div>
                    </div>
                    <hr class="border-light">
                    <p class="text-center text-light mb-0">&copy; 2025 AniListo. All rights reserved.
                    </p>
                </div>
            </div>
        </footer>
        <button id="backToTopBtn" class="btn shadow d-flex align-items-center justify-content-center">
            <i class="bi bi-chevron-up"></i>
        </button>
        <script type="text/javascript" src="common.js"></script>
    </body>

</html>
