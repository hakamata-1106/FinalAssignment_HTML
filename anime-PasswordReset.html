<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - AnimeHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="auth-layout.css">
    <link rel="icon" href="images/favicon/Fav.login.png">
    <style>
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            padding: 12px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
            color: white !important;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }

        .divider span {
            padding: 0 15px;
            color: #6b7280;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <!-- PC用（md〜） -->
    <a href="index.html"
        class="d-none d-md-block back-link position-absolute top-0 start-0 m-3 text-white text-decoration-none">
        <i class="bi bi-arrow-left-circle"></i> ホームに戻る
    </a>

    <div class="login-container">
        <!-- スマホ用（〜md） -->
        <a href="index.html" class="d-md-none back-link text-white text-decoration-none position-static mb-3">
            <i class="bi bi-arrow-left-circle"></i> ホームに戻る
        </a>
        <div class="login-card mt-3 mt-md-0">
            <!-- ログインヘッダー -->
            <div class="login-header">
                <i class="bi bi-film display-3 mb-3"></i>
                <h2 class="fw-bold mb-2 mt-2">パスワードをリセット</h2>
            </div>

            <!-- ログインフォーム -->
            <div class="login-body">
                <form id="loginForm">
                    <!-- メールアドレス -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">
                            <i class="bi bi-envelope"></i> 登録済みのメールアドレス
                        </label>
                        <input type="email" class="form-control form-control-lg" id="email" required>
                    </div>

                    <button type="submit" class="btn btn-login btn-lg w-100 mb-3 mt-3">
                        <i class="bi bi-box-arrow-in-right"></i> 送信
                    </button>

                    <a href="anime-login.html" class="text-decoration-bottom small">ログイン画面へ</a>
                </form>
            </div>
        </div>

        <scrip src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
            </script>
</body>

</html>
